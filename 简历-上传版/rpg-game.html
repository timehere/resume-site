<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>重叠梦·破幻｜作品介绍</title>
  <style>
    :root {
      --bg: #f7f8fb;
      --surface: rgba(255, 255, 255, .55);
      --text: #172033;
      --muted: #5c667a;
      --line: rgba(31, 42, 68, .12);
      --primary: #2563eb;
      --secondary: #0f766e;
      --shadow: 0 18px 50px rgba(27, 39, 71, .12);
      --radius: 18px;
      --max: 1080px;
    }

    * { box-sizing: border-box; }

    body {
      position: relative;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.8;
      min-height: 100vh;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(90deg, rgba(247, 248, 251, .94), rgba(247, 248, 251, .86) 44%, rgba(247, 248, 251, .72)),
        radial-gradient(circle at 8% 0, rgba(37, 99, 235, .14), transparent 30rem),
        radial-gradient(circle at 92% 8%, rgba(15, 118, 110, .14), transparent 26rem);
      pointer-events: none;
    }

    .page-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      background: #edf3fb;
    }

    .page-bg img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transform: scale(1.03);
      transition: opacity var(--fade-ms, 1800ms) ease;
      will-change: opacity;
    }

    .page-bg img:first-child,
    .page-bg.is-ready img.is-active {
      opacity: 1;
    }

    .page-bg.is-ready img {
      opacity: 0;
    }

    a { color: inherit; text-decoration: none; }

    .wrap {
      max-width: var(--max);
      margin: 0 auto;
      padding: 34px 22px 64px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 26px;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 13px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      font-weight: 800;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(260px, .5fr);
      gap: 0;
      align-items: stretch;
    }

    .copy {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      padding: clamp(26px, 5vw, 48px);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .copy,
    .poster-panel {
      min-height: 340px;
    }

    .eyebrow {
      color: var(--secondary);
      font-weight: 900;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 7vw, 68px);
      line-height: 1.05;
    }

    .lead {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 17px;
      white-space: pre-line;
    }

    .poster-panel {
      padding: 22px 0;
      display: grid;
      place-items: center end;
      background: transparent;
    }

    .poster-stage {
      position: relative;
      width: auto;
      height: 330px;
      max-height: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(27, 39, 71, .12);
    }

    .poster-stage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    .badge {
      padding: 7px 11px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(37, 99, 235, .08);
      color: var(--primary);
      font-size: 13px;
      font-weight: 900;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-top: 28px;
    }

    .gallery-card {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(27, 39, 71, .08);
    }

    .gallery-card figure {
      margin: 0;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #e8edf5;
    }

    .gallery-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .6s ease;
    }

    .gallery-card:hover img {
      transform: scale(1.04);
    }

    .gallery-card .cap {
      padding: 18px 20px;
    }

    .gallery-card h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
    }

    .gallery-card p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    @media (max-width: 820px) {
      .hero,
      .gallery {
        grid-template-columns: 1fr;
      }

      .copy,
      .poster-panel { min-height: auto; }
      .poster-panel {
        padding: 0 22px 22px;
        place-items: center;
      }
      .poster-stage {
        width: min(320px, 100%);
        height: auto;
      }
    }
  </style>
</head>
<body>
  <div class="page-bg" data-image-fader data-interval="3200" data-fade-ms="1800" aria-hidden="true">
    <img src="assets/rpg-detail-01.png" alt="">
    <img src="assets/rpg-detail-02.png" alt="">
    <img src="assets/rpg-detail-03.jpg" alt="">
  </div>
  <main class="wrap">
    <div class="top">
      <a class="back" href="index.html">← 返回简历首页</a>
    </div>

    <section class="hero">
      <div class="copy">
        <div class="eyebrow">游戏原型作品介绍</div>
        <h1>重叠梦·破幻</h1>
        <p class="lead">没有出口的房间直通地下，没有阻碍的道路寸步难行，没有灵魂的偏爱扼住咽喉，过去时是未来时。浮生若梦，梦里不知身是客，一晌贪欢。怅然悬河八万里，天上人间。半生行踏安为幻，孤灯明灭，案前人声寂。</p>
        <div class="badges">
          <span class="badge">RPG</span>
          <span class="badge">玩法设计</span>
          <span class="badge">场景探索</span>
          <span class="badge">AI 辅助创作</span>
        </div>
      </div>
      <div class="poster-panel" aria-label="RPG 游戏视觉线索">
        <div class="poster-stage">
          <img src="assets/rpg-detail-01.png" alt="古籍残卷中的世界观线索">
        </div>
      </div>
    </section>

    <section class="gallery">
      <article class="gallery-card">
        <figure><img src="assets/rpg-detail-01.png" alt="古籍残卷"></figure>
        <div class="cap">
          <h2>世界观线索</h2>
          <p>从残卷文本中提取设定，尝试把古典意象转化为可探索的游戏叙事。</p>
        </div>
      </article>

      <article class="gallery-card">
        <figure><img src="assets/rpg-detail-02.png" alt="封闭房间"></figure>
        <div class="cap">
          <h2>场景氛围</h2>
          <p>用封闭空间营造迷失感，作为玩家进入游戏后的第一个情绪锚点。</p>
        </div>
      </article>

      <article class="gallery-card">
        <figure><img src="assets/rpg-detail-03.jpg" alt="府邸俯瞰地图"></figure>
        <div class="cap">
          <h2>关卡地图</h2>
          <p>以对称院落为原型，规划主线路径与可探索区域，验证空间叙事节奏。</p>
        </div>
      </article>
    </section>
  </main>
  <script>
    function setupImageFaders(root = document) {
      root.querySelectorAll("[data-image-fader]").forEach(fader => {
        const images = Array.from(fader.querySelectorAll("img"));
        if (images.length < 2) return;
        if (fader._fadeTimer) clearInterval(fader._fadeTimer);
        const interval = Number(fader.dataset.interval) || 3000;
        const fadeMs = Number(fader.dataset.fadeMs) || 1200;
        fader.style.setProperty("--fade-ms", fadeMs + "ms");

        let activeIndex = 0;
        const show = index => {
          activeIndex = index;
          images.forEach((img, imageIndex) => {
            img.classList.toggle("is-active", imageIndex === activeIndex);
          });
        };

        const start = () => {
          fader.classList.add("is-ready");
          show(0);
          fader._fadeTimer = setInterval(() => {
            show((activeIndex + 1) % images.length);
          }, interval);
        };

        const preload = images.map(img => {
          if (img.complete) return Promise.resolve();
          if (img.decode) return img.decode().catch(() => {});
          return new Promise(resolve => {
            img.addEventListener("load", resolve, { once: true });
            img.addEventListener("error", resolve, { once: true });
          });
        });

        Promise.all(preload).then(start);
      });
    }

    setupImageFaders();
  </script>
</body>
</html>
