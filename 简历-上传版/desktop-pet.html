<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>电脑宠物｜作品介绍</title>
  <style>
    :root {
      --bg: #f7f8fb;
      --surface: rgba(255, 255, 255, .74);
      --text: #172033;
      --muted: #657187;
      --line: rgba(31, 42, 68, .12);
      --primary: #2563eb;
      --secondary: #0f766e;
      --shadow: 0 18px 50px rgba(27, 39, 71, .12);
      --radius: 18px;
      --max: 1080px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: var(--text);
      background:
        linear-gradient(90deg, rgba(247, 248, 251, .92), rgba(247, 248, 251, .78) 48%, rgba(247, 248, 251, .58)),
        url("assets/desktop-pet-bg.jpg") center / cover fixed no-repeat;
      line-height: 1.75;
    }

    a { color: inherit; text-decoration: none; }

    .wrap {
      max-width: var(--max);
      margin: 0 auto;
      padding: 34px 22px 64px;
    }

    .top {
      margin-bottom: 26px;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 13px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      font-weight: 800;
      box-shadow: 0 8px 24px rgba(27, 39, 71, .08);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(280px, .8fr);
      gap: clamp(22px, 4vw, 44px);
      align-items: stretch;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      padding: clamp(30px, 6vw, 58px);
    }

    .copy {
      display: flex;
      flex-direction: column;
    }

    .eyebrow {
      color: var(--secondary);
      font-weight: 900;
      margin-bottom: 10px;
      font-size: 13px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4.2vw, 42px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .intro {
      margin-top: 18px;
      max-width: 520px;
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: clamp(12px, 1.45vw, 16px);
      font-weight: 800;
    }

    .intro p {
      margin: 0;
    }

    .intro .punch {
      color: var(--muted);
      font-size: inherit;
      font-weight: inherit;
      margin-top: 0;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 28px;
    }

    .badge {
      padding: 7px 11px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(37, 99, 235, .08);
      color: var(--primary);
      font-size: 13px;
      font-weight: 900;
    }

    .pet-tower {
      position: relative;
      aspect-ratio: 1024 / 1536;
      border-radius: 16px;
      overflow: hidden;
    }

    .pet-tower .tower-bg,
    .pet-tower .tower-fg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      mix-blend-mode: multiply;
    }

    .pet-tower .tower-bg { z-index: 1; }

    .pet-tower .tower-fg {
      z-index: 3;
      clip-path: inset(64% 0 0 0);
      opacity: 0;
      pointer-events: none;
    }

    .pet-tower .pet-fox {
      position: absolute;
      z-index: 2;
      bottom: 46%;
      left: 0%;
      width: 70px;
      height: auto;
      pointer-events: none;
      filter: drop-shadow(0 6px 9px rgba(27, 39, 71, .22));
      animation: fox-pace 4s ease-in-out infinite alternate;
    }

    @keyframes fox-pace {
      from { transform: translateX(0); }
      to   { transform: translateX(50px); }
    }

    @media (max-width: 680px) {
      .wrap { padding-inline: 16px; }
      .hero {
        grid-template-columns: 1fr;
        padding: 26px;
      }
      .pet-tower { min-height: 0; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <a class="back" href="index.html">← 返回简历首页</a>
    </div>

    <section class="hero">
      <div class="copy">
        <div class="eyebrow">互动原型作品介绍</div>
        <h1>电脑宠物</h1>
        <div class="intro" aria-label="电脑宠物简介">
          <p>还在为一个人的时光而感到孤独吗？</p>
          <p>还在为普通的生活感到平淡吗？</p>
          <p>还在为波澜不惊的日子而感到无趣吗？</p>
          <p class="punch">领养一只小宠物吧</p>
          <p>为你平平淡淡的生活掀起波澜。</p>
          <p>它可以在你必要的时候进行不必要的破坏</p>
          <p>可以在你忙碌的时候让你忙上加忙</p>
          <p>可以在你不忙的时候给你找点事做</p>
          <p class="punch">领养一只小宠物吧</p>
          <p>让你的生活一波三折</p>
          <p>好便宜</p>
        </div>
        <div class="badges">
          <span class="badge">桌面陪伴</span>
          <span class="badge">互动原型</span>
          <span class="badge">轻量提醒</span>
          <span class="badge">趣味反馈</span>
        </div>
      </div>
      <div class="pet-tower" aria-label="宠物爬架插画">
        <img class="tower-bg" src="assets/cat-tree.png" alt="木质宠物爬架">
        <img class="pet-fox" id="petFox" src="assets/walk/walk-1.png" alt="在爬架上走动的小狐狸">
        <img class="tower-fg" src="assets/cat-tree.png" alt="">
      </div>
    </section>
  </main>
  <script>
    (function () {
      const fox = document.getElementById("petFox");
      if (!fox) return;
      const frames = Array.from({ length: 8 }, function (_, i) { return "assets/walk/walk-" + (i + 1) + ".png"; });
      let i = 0;
      setInterval(function () {
        i = (i + 1) % frames.length;
        fox.src = frames[i];
      }, 100);
    })();
  </script>
</body>
</html>
