<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>xxx｜AI 应用方向个人简历</title>
  <style>
    :root {
      --bg: #f7f8fb;
      --surface: rgba(255, 255, 255, .82);
      --surface-strong: #ffffff;
      --text: #172033;
      --muted: #657187;
      --line: rgba(31, 42, 68, .12);
      --primary: #2563eb;
      --primary-2: #0f766e;
      --accent: #f59e0b;
      --shadow: 0 18px 50px rgba(27, 39, 71, .11);
      --shadow-soft: 0 8px 24px rgba(27, 39, 71, .08);
      --radius: 18px;
      --radius-sm: 12px;
      --max: 1120px;
    }

    [data-theme="dark"] {
      --bg: #0e1422;
      --surface: rgba(22, 31, 49, .78);
      --surface-strong: #151f31;
      --text: #eef4ff;
      --muted: #9daac1;
      --line: rgba(226, 232, 240, .14);
      --primary: #60a5fa;
      --primary-2: #2dd4bf;
      --accent: #fbbf24;
      --shadow: 0 18px 52px rgba(0, 0, 0, .32);
      --shadow-soft: 0 8px 24px rgba(0, 0, 0, .24);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 86px;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, .14), transparent 34rem),
        radial-gradient(circle at 88% 12%, rgba(15, 118, 110, .14), transparent 28rem),
        linear-gradient(135deg, rgba(255,255,255,.12) 0 25%, transparent 25% 50%, rgba(255,255,255,.1) 50% 75%, transparent 75%),
        var(--bg);
      background-size: auto, auto, 36px 36px, auto;
      line-height: 1.65;
    }

    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }

    .topbar {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 50;
      backdrop-filter: blur(18px);
      background: color-mix(in srgb, var(--surface) 86%, transparent);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      max-width: var(--max);
      margin: 0 auto;
      min-height: 68px;
      padding: 0 22px;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      white-space: nowrap;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: white;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      box-shadow: var(--shadow-soft);
      font-size: 15px;
    }

    .navlinks {
      display: flex;
      gap: 4px;
      margin-left: auto;
      align-items: center;
    }

    .navlinks a,
    .icon-btn,
    .btn {
      border: 1px solid transparent;
      border-radius: 999px;
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 13px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      transition: transform .18s ease, background .18s ease, border-color .18s ease, color .18s ease, box-shadow .18s ease;
    }

    .navlinks a:hover,
    .icon-btn:hover {
      background: color-mix(in srgb, var(--primary) 9%, transparent);
      color: var(--text);
    }

    .btn {
      color: white;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      box-shadow: 0 10px 28px color-mix(in srgb, var(--primary) 24%, transparent);
      font-weight: 700;
    }

    .btn.secondary {
      color: var(--text);
      background: var(--surface-strong);
      border-color: var(--line);
      box-shadow: none;
    }

    .btn:hover,
    .card:hover,
    .metric:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
    }

    .icon {
      width: 18px;
      height: 18px;
      display: inline-block;
      vertical-align: middle;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    main {
      max-width: var(--max);
      margin: 0 auto;
      padding: 104px 22px 54px;
    }

    section { margin: 54px 0; }

    .hero {
      min-height: calc(100vh - 130px);
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 28px;
      align-items: center;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(18px);
    }

    .hero-copy {
      padding: clamp(26px, 5vw, 54px);
      position: relative;
      overflow: hidden;
    }

    .hero-copy::after {
      content: "";
      position: absolute;
      right: -90px;
      top: 90px;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, color-mix(in srgb, var(--primary) 24%, transparent), transparent 66%);
      pointer-events: none;
    }

    .hero-ppt {
      position: absolute;
      right: 22px;
      bottom: 22px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .02em;
      color: #fff;
      background: var(--primary);
      box-shadow: var(--shadow);
      text-decoration: none;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .hero-ppt:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(8, 13, 24, .26);
    }

    .hero-ppt .ppt-ico {
      width: 16px;
      height: 16px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--primary-2);
      font-weight: 800;
      letter-spacing: 0;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 68px);
      line-height: 1.04;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: clamp(20px, 2.7vw, 30px);
      line-height: 1.9;
      font-weight: 650;
      max-width: 940px;
    }

    .contact-strip {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin-top: 34px;
      padding: 24px 28px;
      border-radius: 18px;
      background: rgba(255, 255, 255, .64);
      border: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
    }

    [data-theme="dark"] .contact-strip {
      background: rgba(15, 23, 42, .48);
    }

    .contact-item {
      display: grid;
      gap: 6px;
    }

    .contact-item > span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .contact-item strong {
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: clamp(18px, 2.2vw, 26px);
      line-height: 1.25;
      letter-spacing: 0;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 26px;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface-strong) 82%, transparent);
      color: var(--text);
      border-radius: 999px;
      padding: 7px 11px;
      font-size: 13px;
      font-weight: 700;
    }

    .profile-card {
      padding: 24px;
    }

    .profile-svg {
      width: 100%;
      aspect-ratio: 1.2 / 1;
      border-radius: 16px;
      background: linear-gradient(135deg, color-mix(in srgb, var(--primary) 18%, transparent), color-mix(in srgb, var(--primary-2) 16%, transparent));
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .quick-list {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .quick-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }

    .quick-item:last-child { border-bottom: 0; }
    .quick-item span:first-child { color: var(--muted); }
    .quick-item span:last-child { font-weight: 800; text-align: right; }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 18px;
    }

    .section-title h2 {
      margin: 0;
      font-size: clamp(24px, 4vw, 36px);
      line-height: 1.15;
    }

    .section-title p {
      margin: 6px 0 0;
      color: var(--muted);
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .metric {
      padding: 20px;
      border-radius: var(--radius-sm);
      background: var(--surface);
      border: 1px solid var(--line);
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .metric strong {
      display: block;
      font-size: 28px;
      line-height: 1;
      color: var(--primary);
      margin-bottom: 10px;
    }

    .metric span { color: var(--muted); font-size: 14px; }

    .portfolio-showcase {
      position: relative;
      margin-inline: calc((100vw - min(100vw - 44px, var(--max))) / -2);
      padding: 0 calc((100vw - min(100vw - 44px, var(--max))) / 2);
      min-height: 100vh;
      overflow: hidden;
      border-radius: 0;
    }

    .portfolio-sticky {
      position: sticky;
      top: 92px;
      height: calc(100vh - 92px);
      display: flex;
      align-items: center;
      overflow: hidden;
      padding: 8px 0 18px;
    }

    .portfolio-rail {
      position: relative;
      z-index: 1;
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: clamp(300px, 38vw, 520px);
      gap: clamp(18px, 4vw, 54px);
      width: max-content;
      transform: translate3d(var(--portfolio-x, 0px), 0, 0);
      transition: transform .08s linear;
      will-change: transform;
    }

    .portfolio-card {
      position: relative;
      display: grid;
      align-content: end;
      color: inherit;
      overflow: hidden;
      min-height: clamp(420px, 54vw, 560px);
      border-radius: 18px;
      border: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .02), rgba(8, 13, 24, .46)),
        linear-gradient(180deg, #7bd5ea, #bcecf4 62%, #ecfbff);
      box-shadow: var(--shadow-soft);
      user-select: none;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .portfolio-card.empty {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .72), rgba(245, 248, 252, .58)),
        rgba(255, 255, 255, .46);
      backdrop-filter: blur(10px);
    }

    .portfolio-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
    }

    .portfolio-card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255, 255, 255, .02) 35%, rgba(8, 13, 24, .42));
    }

    .portfolio-card.empty::after {
      background: linear-gradient(180deg, rgba(255,255,255,.08) 28%, rgba(225, 232, 242, .64));
    }

    .portfolio-scene {
      position: absolute;
      inset: 0;
    }

    .portfolio-scene img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 36%;
      opacity: 0;
      transform: scale(1.02);
      display: block;
      transition: opacity var(--fade-ms, 1200ms) ease;
      will-change: opacity;
    }

    .portfolio-scene img:first-child,
    .portfolio-scene.is-ready img.is-active {
      opacity: 1;
    }

    .portfolio-scene.is-ready img {
      opacity: 0;
    }

    .portfolio-scene video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      background: #0b1020;
    }

    .portfolio-scene img.fit {
      position: absolute;
      inset: auto;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 82%;
      height: 82%;
      object-fit: contain;
      border-radius: 14px;
      z-index: 1;
      box-shadow: 0 14px 34px rgba(8, 13, 24, .30);
    }

    .portfolio-scene.fit-bg::before {
      content: "";
      position: absolute;
      inset: -24px;
      background-image: var(--bg);
      background-size: cover;
      background-position: center;
      filter: blur(26px) brightness(.92) saturate(1.15);
      z-index: 0;
    }

    .portfolio-caption {
      position: absolute;
      left: 32px;
      right: 32px;
      bottom: 30px;
      z-index: 1;
      color: white;
      display: grid;
      gap: 12px;
    }

    .portfolio-caption strong {
      font-size: clamp(28px, 4.8vw, 50px);
      line-height: 1.08;
      letter-spacing: 0;
      color: rgba(20, 27, 43, .82);
      text-shadow: 0 1px 0 rgba(255, 255, 255, .35);
    }

    .portfolio-caption span {
      color: rgba(20, 27, 43, .62);
      font-size: 14px;
      font-weight: 800;
    }

    .portfolio-index {
      position: absolute;
      left: 32px;
      top: 30px;
      z-index: 1;
      color: rgba(255, 255, 255, .9);
      font-weight: 900;
      letter-spacing: .04em;
      text-shadow: 0 6px 18px rgba(31, 42, 68, .2);
    }

    .portfolio-open {
      width: fit-content;
      margin-top: 8px;
      padding: 7px 11px;
      border-radius: 999px;
      color: white;
      background: rgba(255, 255, 255, .18);
      border: 1px solid rgba(255, 255, 255, .28);
      font-size: 13px;
      font-weight: 800;
    }

    .tabs {
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
    }

    .tablist {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
    }

    .tab {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      color: var(--muted);
      background: transparent;
      border-radius: 999px;
      padding: 9px 14px;
      cursor: pointer;
      font-weight: 800;
      transition: background .18s ease, color .18s ease, border-color .18s ease;
    }

    .tab[aria-selected="true"] {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      border-color: transparent;
      color: white;
    }

    .tabpanel { padding: 22px; }
    .tabpanel[hidden] { display: none; }

    .timeline {
      display: grid;
      gap: 16px;
    }

    .entry {
      position: relative;
      padding: 18px 18px 18px 22px;
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface-strong) 72%, transparent);
      border-radius: var(--radius-sm);
    }

    .entry::before {
      content: "";
      position: absolute;
      left: 0;
      top: 18px;
      bottom: 18px;
      width: 4px;
      border-radius: 999px;
      background: linear-gradient(var(--primary), var(--primary-2));
    }

    .entry-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: baseline;
      margin-bottom: 8px;
    }

    .entry h3,
    .card h3 {
      margin: 0;
      font-size: 18px;
      line-height: 1.3;
    }

    .meta {
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    ul {
      margin: 10px 0 0;
      padding-left: 20px;
      color: var(--muted);
    }

    li { margin: 6px 0; }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      padding: 20px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--surface);
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .card p { color: var(--muted); margin: 10px 0 0; }

    .stack {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .mini {
      font-size: 12px;
      padding: 5px 8px;
      border-radius: 999px;
      color: color-mix(in srgb, var(--primary) 82%, var(--text));
      background: color-mix(in srgb, var(--primary) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--primary) 20%, transparent);
      font-weight: 800;
    }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .skill-group h3 {
      margin: 0 0 14px;
      font-size: 17px;
    }

    .skill-row {
      display: grid;
      gap: 6px;
      margin: 13px 0;
    }

    .skill-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .bar {
      height: 8px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--muted) 16%, transparent);
      overflow: hidden;
    }

    .bar i {
      display: block;
      height: 100%;
      width: var(--v);
      border-radius: inherit;
      background: linear-gradient(90deg, var(--primary), var(--primary-2), var(--accent));
    }

    .edu-grid {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 16px;
    }

    .edu-table {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0;
    }

    .edu-table li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 20px 0;
      border-bottom: 1px solid var(--line);
    }

    .edu-table li:last-child { border-bottom: 0; }

    .edu-table .label {
      color: var(--muted);
      font-size: 15px;
      flex-shrink: 0;
    }

    .edu-table .value {
      font-size: 18px;
      font-weight: 800;
      text-align: right;
    }

    .section-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
      margin-left: 4px;
      vertical-align: super;
    }

    .cert-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 10px;
      margin: 0 -10px;
      border-radius: 10px;
      cursor: pointer;
      color: var(--text);
      transition: background .18s ease, color .18s ease, transform .18s ease;
    }

    .cert-item:hover {
      background: color-mix(in srgb, var(--primary) 9%, transparent);
      transform: translateX(2px);
    }

    .cert-item:hover .cert-name {
      color: var(--primary);
    }

    .cert-item:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .cert-name {
      font-weight: 600;
      line-height: 1.45;
    }

    .cert-view {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      color: var(--primary);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .cert-view .icon { width: 16px; height: 16px; }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 95;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(8, 13, 24, .76);
      backdrop-filter: blur(8px);
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox-figure {
      max-width: min(960px, 94vw);
      max-height: 92vh;
      display: grid;
      gap: 14px;
      justify-items: center;
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 80vh;
      border-radius: 14px;
      box-shadow: var(--shadow);
      background: #fff;
      display: block;
    }

    .lightbox-placeholder {
      width: min(520px, 80vw);
      min-height: 320px;
      border-radius: 14px;
      background: var(--surface-strong);
      color: var(--muted);
      display: grid;
      place-content: center;
      text-align: center;
      padding: 28px;
      box-shadow: var(--shadow);
      font-weight: 700;
    }

    .lightbox-cap {
      color: #fff;
      text-align: center;
      font-weight: 700;
      font-size: 15px;
    }

    .lightbox-close {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .28);
      background: rgba(255, 255, 255, .14);
      color: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background .18s ease;
    }

    .lightbox-close:hover {
      background: rgba(255, 255, 255, .26);
    }

    @media (max-width: 640px) {
      .edu-table li { padding: 16px 0; }
      .edu-table .value { font-size: 16px; }
    }

    .footer {
      padding: 0;
      text-align: center;
      color: var(--muted);
    }

    .to-top {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 40;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--surface-strong);
      color: var(--text);
      box-shadow: var(--shadow-soft);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: opacity .18s ease, transform .18s ease;
    }

    .to-top.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .fade {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity .45s ease, transform .45s ease;
    }

    .fade.in {
      opacity: 1;
      transform: translateY(0);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(14px);
      padding: 10px 14px;
      border-radius: 999px;
      color: white;
      background: rgba(20, 30, 48, .92);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
      z-index: 90;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .editor-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: rgba(10, 16, 28, .48);
      backdrop-filter: blur(10px);
    }

    .editor-backdrop.open {
      display: flex;
    }

    .editor-panel {
      width: min(920px, 100%);
      max-height: min(760px, calc(100vh - 44px));
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      background: var(--surface-strong);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .editor-head,
    .editor-actions {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
    }

    .editor-actions {
      border-top: 1px solid var(--line);
      border-bottom: 0;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .editor-head h2 {
      margin: 0;
      font-size: 18px;
    }

    .editor-head p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .editor-body {
      padding: 16px;
      overflow: auto;
    }

    .editor-body textarea {
      width: 100%;
      min-height: 520px;
      resize: vertical;
      padding: 14px;
      color: var(--text);
      background: color-mix(in srgb, var(--bg) 68%, var(--surface-strong));
      border: 1px solid var(--line);
      border-radius: 12px;
      font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      outline: none;
    }

    .editor-body textarea:focus {
      border-color: color-mix(in srgb, var(--primary) 58%, var(--line));
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 12%, transparent);
    }

    [data-edit] {
      border-radius: 8px;
      outline: 0 solid transparent;
      transition: outline-color .18s ease, background .18s ease, box-shadow .18s ease;
    }

    body.inline-editing [data-edit] {
      cursor: text;
      outline: 1px dashed color-mix(in srgb, var(--primary) 46%, transparent);
      background: color-mix(in srgb, var(--primary) 7%, transparent);
    }

    body.inline-editing [data-edit]:focus {
      outline: 2px solid var(--primary);
      background: color-mix(in srgb, var(--primary) 12%, transparent);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 12%, transparent);
    }

    .edit-hint {
      position: fixed;
      left: 50%;
      bottom: 78px;
      z-index: 70;
      transform: translateX(-50%);
      padding: 10px 14px;
      color: white;
      background: rgba(20, 30, 48, .92);
      border-radius: 999px;
      box-shadow: var(--shadow-soft);
      display: none;
      font-size: 13px;
      font-weight: 700;
    }

    body.inline-editing .edit-hint {
      display: block;
    }

    @media (max-width: 920px) {
      .nav { flex-wrap: wrap; min-height: auto; padding: 12px 18px; }
      .navlinks { order: 3; width: 100%; overflow-x: auto; margin-left: 0; padding-bottom: 2px; }
      main { padding-top: 132px; }
      .hero, .edu-grid { grid-template-columns: 1fr; }
      .hero { min-height: auto; }
      .metrics, .skills-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .cards { grid-template-columns: 1fr; }
      .profile-svg { max-height: 280px; }
    }

    @media (max-width: 560px) {
      main { padding-inline: 16px; }
      .metrics, .skills-grid { grid-template-columns: 1fr; }
      .contact-strip { grid-template-columns: 1fr; padding: 20px; }
      .portfolio-showcase { min-height: 118vh; }
      .portfolio-sticky { top: 126px; height: calc(100vh - 126px); }
      .portfolio-rail { grid-auto-columns: min(82vw, 360px); }
      .portfolio-card { min-height: 420px; }
      .entry-head { display: block; }
      .meta { white-space: normal; margin-top: 4px; }
      .hero-actions .btn { width: 100%; }
      .section-title { display: block; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition: none !important;
        animation: none !important;
      }
      .fade { opacity: 1; transform: none; }
    }

    @media print {
      :root {
        --bg: #ffffff;
        --surface: #ffffff;
        --surface-strong: #ffffff;
        --text: #111827;
        --muted: #374151;
        --line: #d1d5db;
        --primary: #1d4ed8;
        --primary-2: #0f766e;
      }

      body {
        background: #ffffff !important;
        font-size: 12px;
      }

      .topbar,
      .to-top,
      .toast,
      .editor-backdrop,
      .edit-hint,
      .hero-actions,
      .profile-svg,
      .tablist {
        display: none !important;
      }

      main {
        padding: 0;
        max-width: none;
      }

      section { margin: 18px 0; break-inside: avoid; }
      .hero { display: block; min-height: auto; }
      .panel, .card, .metric, .entry, .tabs {
        box-shadow: none !important;
        border-color: #d1d5db !important;
        break-inside: avoid;
      }

      .hero-copy { padding: 18px; }
      h1 { font-size: 34px; }
      .tabpanel { display: block !important; padding: 12px 0; }
      .tabpanel[hidden] { display: block !important; }
      .cards, .skills-grid, .metrics, .edu-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      a[href]::after { content: ""; }
    }

    function initTabs(container) {
      const tabs = $$('[role="tab"]', container);
      const panels = $$('[role="tabpanel"]', container);

      function activate(index) {
        tabs.forEach((tab, i) => {
          const active = i === index;
          tab.setAttribute("aria-selected", String(active));
          tab.tabIndex = active ? 0 : -1;
          panels[i].hidden = !active;
        });
        tabs[index].focus();
      }

      tabs.forEach((tab, i) => {
        tab.addEventListener("click", () => activate(i));
        tab.addEventListener("keydown", event => {
          const current = tabs.indexOf(document.activeElement);
          if (event.key === "ArrowRight") {
            event.preventDefault();
            activate((current + 1) % tabs.length);
          }
          if (event.key === "ArrowLeft") {
            event.preventDefault();
            activate((current - 1 + tabs.length) % tabs.length);
          }
          if (event.key === "Home") {
            event.preventDefault();
            activate(0);
          }
          if (event.key === "End") {
            event.preventDefault();
            activate(tabs.length - 1);
          }
        });
      });
    }

    function setupLightbox() {
      const lightbox = $("#lightbox");
      const img = $("#lightboxImg");
      const placeholder = $("#lightboxPlaceholder");
      const cap = $("#lightboxCap");
      const closeBtn = $("#lightboxClose");
      if (!lightbox) return;

      function open(name, image) {
        cap.textContent = name || "证书";
        if (image) {
          placeholder.hidden = true;
          img.hidden = false;
          img.alt = name || "证书图片";
          img.onerror = () => {
            img.hidden = true;
            placeholder.hidden = false;
            placeholder.textContent = "证书图片加载失败：「" + (name || "证书") + "」的图片未找到，请把文件放到 " + image;

        } else {
          img.hidden = true;
          placeholder.hidden = false;
          placeholder.textContent = "证书图片待补充：" + (name || "证书");
        }
        lightbox.classList.add("open");
        lightbox.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
      }

      function close() {
        lightbox.classList.remove("open");
        lightbox.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
        img.removeAttribute("src");
        img.onerror = null;
      }

      document.addEventListener("click", event => {
        if (document.body.classList.contains("inline-editing")) return;
        const item = event.target.closest && event.target.closest(".cert-item");
        if (item) {
          event.preventDefault();
          open(item.dataset.certName, item.dataset.certImage);
        }
      });

      document.addEventListener("keydown", event => {
        if (document.body.classList.contains("inline-editing")) return;
        const item = event.target.closest && event.target.closest(".cert-item");
        if (item && (event.key === "Enter" || event.key === " ")) {
          event.preventDefault();
          open(item.dataset.certName, item.dataset.certImage);
        }
        if (event.key === "Escape" && lightbox.classList.contains("open")) close();
      });

      closeBtn.addEventListener("click", close);
      lightbox.addEventListener("click", event => {
        if (event.target === lightbox) close();
      });
    }

    function setupImageFaders(root = document) {
      root.querySelectorAll("[data-image-fader]").forEach(fader => {
        const images = Array.from(fader.querySelectorAll("img"));
        if (images.length < 2) return;
        if (fader._fadeTimer) clearInterval(fader._fadeTimer);
        if (fader._fadeFrame) cancelAnimationFrame(fader._fadeFrame);
        if (fader._fadeObserver) fader._fadeObserver.disconnect();
        const interval = Number(fader.dataset.interval) || 3000;
        const fadeMs = Number(fader.dataset.fadeMs) || 1200;
        fader.style.setProperty("--fade-ms", fadeMs + "ms");

        let activeIndex = 0;
        const show = index => {
          activeIndex = index;
          images.forEach((img, imageIndex) => {
            img.classList.toggle("is-active", imageIndex === activeIndex);
          });
        };

        const startCssFader = () => {
          fader.classList.add("is-ready");
          show(0);
          fader._fadeTimer = setInterval(() => {
            show((activeIndex + 1) % images.length);
          }, interval);
        };

        const preload = images.map(img => {
          if (img.complete) return Promise.resolve();
          if (img.decode) return img.decode().catch(() => {});
          return new Promise(resolve => {
            img.addEventListener("load", resolve, { once: true });
            img.addEventListener("error", resolve, { once: true });
          });
        });

        Promise.all(preload).then(startCssFader);
      });
    }

    function setupScrollGallery(root = document) {
      const galleries = Array.from(root.querySelectorAll("[data-scroll-gallery]"));
      if (!galleries.length) return;

      const clamp = (value, min, max) => Math.min(Math.max(value, min), max);
      let ticking = false;
      const applyGalleryProgress = (gallery, progress) => {
        const rail = gallery.querySelector(".portfolio-rail");
        const state = gallery._scrollGalleryState;
        if (!rail || !state) return;
        state.progress = clamp(progress, 0, 1);
        rail.style.setProperty("--portfolio-x", (-state.travel * state.progress) + "px");
      };

      const sync = () => {
        galleries.forEach(gallery => {
          const rail = gallery.querySelector(".portfolio-rail");
          const sticky = gallery.querySelector(".portfolio-sticky");
          if (!rail || !sticky) return;
          const travel = Math.max(0, rail.scrollWidth - sticky.clientWidth);
          const stickyTop = parseFloat(getComputedStyle(sticky).top) || 0;
          const stickyHeight = sticky.offsetHeight;
          const state = gallery._scrollGalleryState || { progress: 0, travel: 0 };
          gallery._scrollGalleryState = state;
          state.travel = travel;
          state.stickyTop = stickyTop;
          state.stickyHeight = stickyHeight;
          gallery.style.height = Math.max(window.innerHeight - stickyTop, stickyHeight) + "px";
          const rect = gallery.getBoundingClientRect();
          const active = rect.top <= stickyTop + 1 && rect.bottom >= stickyTop + 1;
          if (!active) {
            state.progress = rect.top > stickyTop ? 0 : 1;
          }
          applyGalleryProgress(gallery, state.progress);
        });
        ticking = false;
      };

      const onWheel = event => {
        for (const gallery of galleries) {
          const state = gallery._scrollGalleryState;
          if (!state || !state.travel) continue;
          const rect = gallery.getBoundingClientRect();
          const active = rect.top <= state.stickyTop + 1 && rect.bottom >= state.stickyTop + 1;
          if (!active) continue;

          const delta = Math.abs(event.deltaY) >= Math.abs(event.deltaX) ? event.deltaY : event.deltaX;
          const canMoveForward = delta > 0 && state.progress < 1;
          const canMoveBackward = delta < 0 && state.progress > 0;
          if (!canMoveForward && !canMoveBackward) return;

          event.preventDefault();
          const step = delta / Math.max(420, state.travel * .85);
          applyGalleryProgress(gallery, state.progress + step);
          return;
        }
      };

      const requestSync = () => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(sync);
      };

      if (setupScrollGallery._onScroll) {
        window.removeEventListener("scroll", setupScrollGallery._onScroll);
        window.removeEventListener("resize", setupScrollGallery._onResize);
        window.removeEventListener("wheel", setupScrollGallery._onWheel);
      }
      setupScrollGallery._onScroll = requestSync;
      setupScrollGallery._onResize = requestSync;
      setupScrollGallery._onWheel = onWheel;
      window.addEventListener("scroll", requestSync, { passive: true });
      window.addEventListener("resize", requestSync);
      window.addEventListener("wheel", onWheel, { passive: false });
      requestSync();
    }

    function setupPortfolioScrub(root) {
      const gallery = root.querySelector("[data-scroll-gallery]");
      if (!gallery) return;
      const rail = gallery.querySelector(".portfolio-rail");
      if (!rail) return;
      const vids = Array.from(rail.querySelectorAll(".portfolio-scene video"));
      if (vids.length < 3) return;

      const FALLBACK_DUR = 10.12;
      let dur = FALLBACK_DUR;
      let segs = [[0, dur/3], [dur/3, 2*dur/3], [2*dur/3, dur]];
      const v0 = vids[0];
      const buildSegs = () => {
        if (v0.duration && isFinite(v0.duration) && v0.duration > 0) dur = v0.duration;
        segs = [[0, dur/3], [dur/3, 2*dur/3], [2*dur/3, dur]];
      };
      if (v0.readyState >= 1) buildSegs();
      v0.addEventListener("loadedmetadata", buildSegs);
      vids.forEach(v => { v.muted = true; v.playsInline = true; });

      const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
      let lastP = -2;

      function applyOnce() {
        const state = gallery._scrollGalleryState;
        if (!state) return;
        const p = clamp(state.progress, 0, 1);
        if (p === lastP) return;
        lastP = p;
        const g = p * dur;
        for (let i = 0; i < 3; i++) {
          const [s, e] = segs[i];
          const t = clamp(g, s, e);
          try { vids[i].currentTime = t; } catch (_) {}
        }
      }

      function loop() {
        applyOnce();
        requestAnimationFrame(loop);
      }
      applyOnce();
      requestAnimationFrame(loop);
    }

    function renderResumeContent() {
      renderNav();
      renderHero();
      renderHighlights();
      renderExperience();
      renderProjects();
      renderSkills();
      renderEducation();
      renderFooter();
      setupImageFaders();
      $$(".fade").forEach(node => node.classList.add("in"));
    }

    function setupEditor() {
      const editor = $("#editor");
      const textarea = $("#resumeEditor");

      function openEditor() {
        textarea.value = JSON.stringify(resume, null, 2);
        editor.classList.add("open");
        editor.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
        setTimeout(() => textarea.focus(), 0);
      }

      function closeEditor() {
        editor.classList.remove("open");
        editor.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
      }

      $("#editBtn").addEventListener("click", openEditor);
      $("#closeEditor").addEventListener("click", closeEditor);
      $("#closeEditor2").addEventListener("click", closeEditor);

      $("#copyResumeData").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(textarea.value);
          toast("已复制当前简历数据");
        } catch (error) {
          textarea.focus();
          textarea.select();
          toast("已选中文本，可按 Command + C 复制");
        }
      });

      $("#downloadSource").addEventListener("click", () => {
        try {
          const nextResume = JSON.parse(textarea.value);
          if (!nextResume || typeof nextResume !== "object" || !nextResume.name) {
            throw new Error("JSON 中至少需要保留 name 字段。");
          }
          downloadTextFile("index.html", buildSourceWithResume(nextResume));
          toast("已下载最新源码 index.html");
        } catch (error) {
          toast("下载失败：JSON 格式不正确");
          console.error(error);
        }
      });

      editor.addEventListener("click", event => {
        if (event.target === editor) closeEditor();
      });

      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && editor.classList.contains("open")) closeEditor();
      });

      $("#saveResume").addEventListener("click", () => {
        try {
          const nextResume = JSON.parse(textarea.value);
          if (!nextResume || typeof nextResume !== "object" || !nextResume.name) {
            throw new Error("JSON 中至少需要保留 name 字段。");
          }
          resume = nextResume;
          localStorage.setItem(resumeStorageKey, JSON.stringify(resume));
          renderResumeContent();
          closeEditor();
          toast("已保存到当前浏览器");
        } catch (error) {
          toast("保存失败：JSON 格式不正确");
          console.error(error);
        }
      });

      $("#resetResume").addEventListener("click", () => {
        if (!confirm("确定恢复源码里的默认简历内容吗？当前浏览器保存的修改会被清除。")) return;
        localStorage.removeItem(resumeStorageKey);
        resume = clone(defaultResume);
        textarea.value = JSON.stringify(resume, null, 2);
        renderResumeContent();
        toast("已恢复默认内容");
      });
    }

    function setupInlineEditing() {
      let enabled = false;
      const btn = $("#inlineEditBtn");

      function setEditableState() {
        $$("[data-edit]").forEach(node => {
          node.contentEditable = enabled ? "true" : "false";
          node.spellcheck = false;
        });
      }

      function toggleInlineEditing() {
        enabled = !enabled;
        document.body.classList.toggle("inline-editing", enabled);
        btn.style.color = enabled ? "var(--primary)" : "";
        btn.setAttribute("aria-pressed", String(enabled));
        setEditableState();
        toast(enabled ? "页面编辑已开启" : "页面编辑已关闭");
      }

      btn.addEventListener("click", toggleInlineEditing);

      document.addEventListener("focusin", event => {
        const node = event.target.closest && event.target.closest("[data-edit]");
        if (!enabled || !node) return;
        node.dataset.beforeEdit = node.textContent;
      });

      document.addEventListener("keydown", event => {
        const node = event.target.closest && event.target.closest("[data-edit]");
        if (!enabled || !node) return;
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          node.blur();
        }
      });

      document.addEventListener("focusout", event => {
        const node = event.target.closest && event.target.closest("[data-edit]");
        if (!enabled || !node) return;
        const nextValue = node.textContent.trim();
        if (nextValue === node.dataset.beforeEdit) return;
        setByPath(resume, node.dataset.edit, nextValue);
        saveResumeLocal();
        renderResumeContent();
        enabled = true;
        document.body.classList.add("inline-editing");
        btn.style.color = "var(--primary)";
        btn.setAttribute("aria-pressed", "true");
        setEditableState();
        toast("已自动保存");
      });
    }

    function boot() {
      renderResumeContent();
      setupTheme();
      setupScroll();
      setupEditor();
      setupInlineEditing();
      setupLightbox();
    }

    boot();
  </script>
</body>
